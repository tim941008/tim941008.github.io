<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台科大選課系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <header class="brand">
        <div>
          <p class="eyebrow">NTUST 115-1</p>
          <h1>選課系統</h1>
        </div>
        <button id="clearSelectionBtn" class="icon-button danger" type="button" title="清空已選課程" aria-label="清空已選課程">
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <section class="filters" aria-label="課程篩選">
        <label class="search-box">
          <span>搜尋</span>
          <input id="searchInput" type="search" placeholder="課名、老師、代碼、備註">
        </label>

        <div class="filter-grid">
          <label>
            <span>年級</span>
            <select id="gradeFilter">
              <option value="">全部</option>
              <option value="1">一年級</option>
              <option value="2">二年級</option>
              <option value="3" selected>三年級</option>
              <option value="4">四年級</option>
            </select>
          </label>
          <label>
            <span>選班</span>
            <select id="classSelect">
              <option value="">顯示全部班級</option>
            </select>
          </label>
          <label>
            <span>系所代碼</span>
            <select id="departmentFilter">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>星期</span>
            <select id="dayFilter">
              <option value="">全部</option>
              <option value="M">星期一</option>
              <option value="T">星期二</option>
              <option value="W">星期三</option>
              <option value="R">星期四</option>
              <option value="F">星期五</option>
              <option value="S">星期六</option>
            </select>
          </label>
          <label>
            <span>類型</span>
            <select id="requireFilter">
              <option value="">全部</option>
              <option value="R">必修</option>
              <option value="E">選修</option>
            </select>
          </label>
          <label>
            <span>衝堂</span>
            <select id="conflictFilter">
              <option value="">全部顯示</option>
              <option value="available">只看可加入</option>
              <option value="conflict">只看會衝堂</option>
            </select>
          </label>
        </div>

        <div style="display:grid;gap:10px;margin-top:8px;">
          <label style="display:flex;flex-direction:column;gap:6px;">
            <span>學號末兩碼</span>
            <input id="studentIdLast2" type="text" maxlength="2" placeholder="例如：12" style="width:100%;">
          </label>
          <button id="applySplitBtn" class="button primary" type="button" style="height:44px;max-width:240px;">一鍵加入課表</button>
          <p style="margin:0;color:var(--muted);font-size:13px;line-height:1.4;">按下後會加入該班可選課程，含必修與分流課程；<strong>數位系統設計不受分流限制</strong>。</p>
        </div>
      </section>

      <section class="search-card" aria-label="搜尋其他課程">
        <div class="panel-heading">
          <div>
            <h2>搜尋其他課程</h2>
            <span>輸入課名、老師或課號，快速找到其他想選的課程。</span>
          </div>
        </div>
        <div class="search-card-body">
          <input id="searchInputCard" type="search" placeholder="搜尋其他課程：課名、老師、代碼、備註" />
        </div>
      </section>


      <section class="selected-summary" aria-label="已選統計">
        <div>
          <strong id="selectedCount">0</strong>
          <span>門課</span>
        </div>
        <div>
          <strong id="creditCount">0</strong>
          <span>學分</span>
        </div>
        <div>
          <strong id="hoursCount">0</strong>
          <span>上課小時</span>
        </div>
        <div>
          <strong id="conflictCount">0</strong>
          <span>衝堂格</span>
        </div>
      </section>

    </aside>

    <main class="main">
      <section class="toolbar">
        <div>
          <h2>我的課表</h2>
        </div>
        <div class="toolbar-actions">
          <button id="printBtn" class="button secondary" type="button">列印</button>
          <button id="exportBtn" class="button primary" type="button">匯出已選</button>
        </div>
      </section>

      <section class="schedule-wrap" aria-label="課表">
        <div id="scheduleGrid" class="schedule-grid"></div>
      </section>

      <section class="results-panel" aria-label="課程列表">
        <div class="panel-heading">
          <h2>課程列表</h2>
          <span id="resultCount">載入中</span>
        </div>
        <div id="courseList" class="course-list"></div>
      </section>

    </main>

    <aside class="rightbar">
      <section class="chosen-panel" aria-label="已選課程">
        <div class="panel-heading">
          <h2>已選課程</h2>
          <span id="chosenHint">尚未加入課程</span>
        </div>
        <div id="chosenList" class="chosen-list"></div>
      </section>
    </aside>
  </div>

  <dialog id="exportDialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2>已選課程 JSON</h2>
        <button class="icon-button" value="cancel" aria-label="關閉">×</button>
      </div>
      <textarea id="exportText" readonly></textarea>
      <menu>
        <button id="copyExportBtn" class="button primary" type="button">複製</button>
        <button class="button secondary" value="cancel">關閉</button>
      </menu>
    </form>
  </dialog>

  <script src="course-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
